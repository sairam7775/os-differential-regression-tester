name: Regression tests

on:
  push:
    branches: ["fix/**", "review/**", "main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install real test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q osdiff.py osdiff tests
      - name: Full suite
        run: python -m unittest discover -s tests -v
      - name: Independent modules and CLI argument paths
        shell: python
        run: |
          import pathlib
          import subprocess
          import sys
          for path in sorted(pathlib.Path("tests").glob("test_*.py")):
              subprocess.run([sys.executable, "-m", "unittest", "discover", "-s", "tests", "-p", path.name, "-v"], check=True)
          for command in ([], ["doctor"], ["run"], ["auto-run"], ["market-run"], ["list-real-devices"]):
              subprocess.run([sys.executable, "osdiff.py", *command, "--help"], check=True)
